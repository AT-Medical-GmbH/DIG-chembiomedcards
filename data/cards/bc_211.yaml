  classification: Erdalkalimetall-Ion · Second Messenger und Strukturelement
  general_properties:
  - Intrazellulär ≈ 100 nmol/l, extrazellulär ≈ 1,2 mmol/l ionisiert
  - Rund 99 % des Körpercalciums im Knochen (Hydroxylapatit)
  biochemical_relevance:
  - Regulation durch PTH, Calcitriol und Calcitonin
  - Kofaktor der Gerinnung (Faktor IV)
  clinical_relevance:
  - 'Hypokalzämie: Tetanie, QT-Verlängerung · Hyperkalzämie: QT-Verkürzung'
  - Maßgeblich ist das ionisierte Ca²⁺ (Gesamt-Ca hängt vom Albumin ab)
  molecular_relevance:
  - Freisetzung aus ER/SR über IP₃- und Ryanodinrezeptoren; Sensor Calmodulin
  mnemonic: Ca²⁺ löst Muskelkontraktion, Exozytose und Gerinnung aus.
