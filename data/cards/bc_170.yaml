back_sections:
  classification: Peptidhormon der B-Zellen des Pankreas · 51 Aminosäuren
  general_properties:
  - A-Kette (21 AS) und B-Kette (30 AS), über zwei Disulfidbrücken verbunden
  - Vorstufe Proinsulin – Abspaltung des C-Peptids
  biochemical_relevance:
  - Fördert Glukoseaufnahme (GLUT4), Glykogen-, Lipid- und Proteinsynthese
  - Hemmt Glukoneogenese, Lipolyse und Ketogenese
  clinical_relevance:
  - Diabetes mellitus Typ 1 (Mangel) und Typ 2 (Resistenz)
  - C-Peptid zeigt die endogene Insulinproduktion an
  molecular_relevance:
  - Insulinrezeptor = Rezeptor-Tyrosinkinase → PI3K/Akt-Signalweg
  mnemonic: Insulin ist das einzige blutzuckersenkende Hormon.
