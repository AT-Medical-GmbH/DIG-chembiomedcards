  classification: Inkretin · Peptidhormon der L-Zellen von Ileum und Kolon
  general_properties:
  - Entsteht aus Proglukagon; Halbwertszeit ≈ 2 min (Abbau durch DPP-4)
  biochemical_relevance:
  - Steigert glukoseabhängig die Insulinsekretion, hemmt Glukagon
  - Verzögert die Magenentleerung und fördert die Sättigung
  clinical_relevance:
  - GLP-1-Rezeptoragonisten (z. B. Semaglutid) bei Typ-2-Diabetes und Adipositas
  - DPP-4-Hemmer (Gliptine) verlängern die GLP-1-Wirkung
  molecular_relevance:
  - GLP-1-Rezeptor (Gs) → cAMP ↑
