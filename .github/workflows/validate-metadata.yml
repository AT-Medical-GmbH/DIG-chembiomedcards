name: Validate Metadata

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate card registry metadata
        run: python3 scripts/validate_card_metadata.py --csv cards/registry/cards.master.csv
      - name: Install card pipeline dependencies (validation only)
        run: pip install pyyaml jsonschema
      - name: Validate card data (data/cards/*.yaml)
        run: python3 scripts/validate_cards.py
