# Overlay für den Betrieb hinter Traefik (ATMED-traefik). Ersetzt den lokalen Port durch
# Traefik-Labels und hängt pharma-web zusätzlich ins externe Proxy-Netz.
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml --env-file .env up -d
services:
  pharma-web:
    ports: !reset []
    networks: [internal, proxy]
    # Listenform, damit der Routername (PHARMA_ROUTER) je Umgebung eindeutig ist
    # (Staging und Produktion am selben Traefik). Standard bleibt "pharma-cards".
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"
      - "traefik.http.routers.${PHARMA_ROUTER:-pharma-cards}.rule=Host(`${PHARMA_HOST:?PHARMA_HOST setzen}`)"
      - "traefik.http.routers.${PHARMA_ROUTER:-pharma-cards}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${PHARMA_ROUTER:-pharma-cards}.tls=true"
      - "traefik.http.routers.${PHARMA_ROUTER:-pharma-cards}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${PHARMA_ROUTER:-pharma-cards}.middlewares=${TRAEFIK_MIDDLEWARES:-}"
      - "traefik.http.routers.${PHARMA_ROUTER:-pharma-cards}.service=${PHARMA_ROUTER:-pharma-cards}"
      - "traefik.http.services.${PHARMA_ROUTER:-pharma-cards}.loadbalancer.server.port=8080"

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
