# Pharma Cards — Toxidrome (PH)
# Referenzliste für das Feld `toxidrome`. Inhaltlich knapp als Anker; Details in den Karten.
# Alle Einträge sind fachlich zu prüfen (toxicology_review_needed), bevor Karten freigegeben werden.
schema_version: "1.0.0"
module: PH

toxidromes:
  - slug: cholinerg
    name: Cholinerges Syndrom
    lead_symptoms: "DUMBELS/SLUDGE-Muster (Miosis, Hypersalivation, Bronchorrhö, Bradykardie)"
  - slug: anticholinerg
    name: Anticholinerges Syndrom
    lead_symptoms: "Mydriasis, trockene Haut, Tachykardie, Delir, Harnverhalt"
  - slug: sympathomimetisch
    name: Sympathomimetisches Syndrom
    lead_symptoms: "Mydriasis, Tachykardie, Hypertonie, Agitation, Schwitzen"
  - slug: opioid
    name: Opioid-Toxidrom
    lead_symptoms: "Miosis, Atemdepression, reduzierte Vigilanz"
  - slug: sedativ_hypnotisch
    name: Sedativ-hypnotisches Toxidrom
    lead_symptoms: "Sedierung, reduzierte Vigilanz, meist erhaltene Atmung (dosisabhängig)"
  - slug: serotonerg
    name: Serotonerges Syndrom
    lead_symptoms: "Neuromuskuläre Erregbarkeit (Klonus), autonome Instabilität, Agitation"
  - slug: malignes_neuroleptisches_syndrom
    name: Malignes neuroleptisches Syndrom
    lead_symptoms: "Rigor, Hyperthermie, autonome Instabilität, Bewusstseinsstörung"

