  question: Wofür stehen Pharmakokinetik und Pharmakodynamik?
back_sections:
- key: kernaussage
  label: Kernaussage
  color_role: base
  text: Pharmakologie beschreibt, was der Körper mit dem Arzneistoff macht (Pharmakokinetik) und was der
    Arzneistoff mit dem Körper macht (Pharmakodynamik).
- key: vertiefung
  label: Zwei Achsen
  color_role: pkpd
  text: '- Pharmakokinetik: LADME (Liberation, Absorption, Distribution, Metabolismus, Elimination)

    - Pharmakodynamik: Rezeptoren, Wirkmechanismus, Dosis-Wirkungs-Beziehung'
- key: klinischer_bezug
  label: Klinischer Bezug
  color_role: clinic
  text: Verständnis beider Achsen erklärt Wirkung, Nebenwirkung, Dosierungsprinzip und Interaktion.
- key: merke
  label: Merke
  color_role: antidote
  text: PK = Konzentrationsverlauf; PD = Wirkung bei gegebener Konzentration.
