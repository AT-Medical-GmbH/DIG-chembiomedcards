chapter: pharmakologie/analgetika
drug_class: nichtopioid_analgetika
substance_name: Metamizol
generic_name: Metamizol
card_type: substance
front_type: substance
level: clinical
difficulty: intermediate
mechanism_of_action: Analgetisch, antipyretisch und spasmolytisch; nur schwach antiphlogistisch.
indications: '- starke akute Schmerzen, Koliken, Tumorschmerzen

  - hohes Fieber ohne Ansprechen auf andere Maßnahmen'
contraindications: Pyrazolon-Allergie, Knochenmarkstörung, G6PD-Mangel, akute hepatische Porphyrie, letztes
  Drittel der Schwangerschaft.
adverse_effects: Agranulozytose (selten, potenziell tödlich), Hypotonie bei rascher i.v.-Gabe, Anaphylaxie.
interactions: Methotrexat (Myelotoxizität).
monitoring: Blutbild bei längerer Gabe; über Infektzeichen aufklären.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
clinical_pearls: 'Fieber, Halsschmerzen, Schleimhautläsionen: sofort an Agranulozytose denken.'
