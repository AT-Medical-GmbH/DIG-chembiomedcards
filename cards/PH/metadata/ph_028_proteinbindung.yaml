begriff_slug: proteinbindung
title: Proteinbindung
subtitle: Freie vs. gebundene Fraktion
module: PH
primary_category: pharmakokinetik
chapter: pharmakologie/distribution
card_type: overview
front_type: principle
level: intermediate
difficulty: intermediate
front_content:
  question: Warum ist nur die freie Fraktion wirksam?
back_sections:
- key: kernaussage
  label: Kernaussage
  color_role: base
  text: Viele Wirkstoffe binden an Plasmaproteine (z. B. Albumin); nur die freie Fraktion ist pharmakologisch
    wirksam.
- key: vertiefung
  label: Prinzip
  color_role: pkpd
  text: Hohe Proteinbindung → kleines effektives Vd; Verdrängung kann die freie Fraktion erhöhen.
- key: risiken_cave
  label: Cave
  color_role: risk
  text: Bei Hypalbuminämie oder Verdrängung steigt die freie, wirksame Fraktion (Vorsicht bei enger therapeutischer
    Breite).
- key: merke
  label: Merke
  color_role: antidote
  text: Nur frei wirkt – gebunden ist Depot.
learning_objectives:
- Bedeutung der Proteinbindung erklären
- Verdrängungseffekte einordnen
