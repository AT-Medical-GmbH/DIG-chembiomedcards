mechanism_of_action: 'Agonist an α1-, β1- und β2-Adrenozeptoren: Vasokonstriktion, positiv inotrop/chronotrop,
  Bronchodilatation.'
indications: '- Reanimation

  - Anaphylaxie

  - schwere Hypotonie/Schock'
contraindications: In vitaler Indikation keine absolute KI. Vorsicht bei KHK und Tachyarrhythmie.
adverse_effects: Tachykardie, Arrhythmien, Hypertonie, erhöhter myokardialer O₂-Bedarf, Hyperglykämie,
  Hypokaliämie.
interactions: Wirkverstärkung durch MAO-Hemmer/TZA möglich.
monitoring: Kontinuierlich EKG und Blutdruck.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
emergency_relevance: Notfall- und Intensivmedikament.
clinical_pearls: 'Applikationsweg und Konzentration unterscheiden sich je Indikation (Anaphylaxie vs.
  Reanimation): Verwechslungsgefahr.'
