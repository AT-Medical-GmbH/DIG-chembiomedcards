chapter: pharmakologie/anaesthesie
drug_class: opioide
substance_name: Remifentanil
generic_name: Remifentanil
card_type: substance
front_type: substance
level: clinical
difficulty: intermediate
mechanism_of_action: µ-Opioidrezeptor-Agonist; Abbau durch unspezifische Esterasen in Blut und Gewebe,
  organunabhängig.
indications: '- Analgesie bei Narkose als kontinuierliche Infusion

  - gut steuerbare Analgosedierung'
contraindications: Kein Bolus ohne Atemwegssicherung. Nicht epidural oder intrathekal (Glycin in der Zubereitung).
adverse_effects: Atemdepression, Bradykardie, Hypotonie, Thoraxrigidität; opioidinduzierte Hyperalgesie.
interactions: Additive ZNS-Dämpfung mit Hypnotika.
monitoring: Atmung, Kreislauf.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
antidote: naloxon
clinical_pearls: 'Die Wirkung endet Minuten nach Infusionsstopp: Anschlussanalgesie rechtzeitig planen.'
