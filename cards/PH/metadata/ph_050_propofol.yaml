card_id: ph_050
slug: ph_050_propofol
title: Propofol
subtitle: Intravenöses Hypnotikum
module: PH
primary_category: anaesthesiepharmakologie
secondary_categories:
- intensivpharmakologie
chapter: pharmakologie/anaesthesie
drug_class: hypnotika_iv
substance_name: Propofol
generic_name: Propofol
card_type: substance
front_type: substance
level: clinical
difficulty: intermediate
mechanism_of_action: 'Positiver allosterischer Modulator am GABA-A-Rezeptor: rasch einsetzende, gut steuerbare
  Hypnose ohne Analgesie.'
indications: '- Narkoseeinleitung und -aufrechterhaltung (TIVA)

  - Sedierung auf Intensivstation'
contraindications: Allergie gegen Bestandteile der Emulsion; Vorsicht bei Hypovolämie und Herzinsuffizienz.
adverse_effects: Hypotonie, Atemdepression bis Apnoe, Injektionsschmerz; bei langer, hoch dosierter Gabe
  Propofol-Infusionssyndrom.
interactions: Additiv mit Opioiden und Benzodiazepinen.
monitoring: Kreislauf, Atmung; bei Langzeitsedierung Laktat, CK, Triglyceride.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
clinical_pearls: 'Keine Analgesie. Infusionssyndrom: metabolische Azidose, Rhabdomyolyse, Herzversagen.'
