mechanism_of_action: Direkte Zufuhr von Glucose hebt den Blutzucker und versorgt das ZNS.
indications: '- Hypoglykämie (auch bei unklarer Bewusstseinsstörung nach BZ-Messung)'
contraindications: Hyperglykämie. Bei Alkoholabusus/Mangelernährung Thiaminmangel bedenken (Wernicke).
adverse_effects: Venenreizung, Thrombophlebitis, Gewebeschaden bei Paravasat hochprozentiger Lösungen,
  Hyperglykämie.
interactions: Keine relevanten pharmakologischen Interaktionen im Akutsetting.
monitoring: Wiederholte BZ-Kontrollen.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
emergency_relevance: Notfall- und Intensivmedikament.
clinical_pearls: 'Bei jeder Bewusstseinsstörung den Blutzucker messen: Hypoglykämie ist schnell behebbar.'
