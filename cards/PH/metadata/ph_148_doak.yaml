level: clinical
difficulty: intermediate
mechanism_of_action: Direkte Hemmung von Faktor Xa (Apixaban, Edoxaban, Rivaroxaban) oder Thrombin (Dabigatran).
indications: '- Schlaganfallprophylaxe bei nichtvalvulärem Vorhofflimmern

  - Therapie und Prophylaxe venöser Thromboembolien'
contraindications: Mechanische Herzklappen, aktive Blutung, schwere Niereninsuffizienz (substanzabhängig),
  Schwangerschaft.
adverse_effects: Blutung; Magen-Darm-Beschwerden (Dabigatran).
interactions: Starke P-gp-/CYP3A4-Hemmer und -Induktoren, Thrombozytenhemmer, NSAR.
monitoring: Nierenfunktion regelmäßig.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
clinical_pearls: 'Antidote: Idarucizumab (Dabigatran), Andexanet alfa (Faktor-Xa-Hemmer, Zulassung beachten).'
