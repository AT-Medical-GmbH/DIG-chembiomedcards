front_content:
  question: Was bedeutet eine enge therapeutische Breite?
back_sections:
- key: kernaussage
  label: Kernaussage
  color_role: base
  text: Die therapeutische Breite beschreibt den Abstand zwischen wirksamer und toxischer Dosis (therapeutischer
    Index).
- key: vertiefung
  label: Kenngröße
  color_role: pkpd
  text: 'Grob: Verhältnis toxische zu wirksame Dosis. Enge therapeutische Breite = kleiner Sicherheitsabstand.'
- key: risiken_cave
  label: Cave
  color_role: risk
  text: Wirkstoffe mit enger therapeutischer Breite (z. B. Digoxin, Lithium, viele Zytostatika) brauchen
    Monitoring.
- key: merke
  label: Merke
  color_role: antidote
  text: Eng = Spiegelkontrolle und vorsichtige Dosisführung.
