indications: '- Schmerzen, Entzündung, Fieber'
contraindications: Aktives Ulkus oder GI-Blutung, schwere Herz-, Nieren-, Leberinsuffizienz, letztes Schwangerschaftsdrittel.
adverse_effects: Magen-Darm-Ulzera und -Blutungen, Nierenfunktionsverschlechterung, Blutdruckanstieg,
  kardiovaskuläres Risiko.
interactions: Antikoagulanzien (Blutung), RAAS-Hemmer und Diuretika (Niere); kann die Plättchenwirkung
  von ASS abschwächen.
monitoring: Nierenfunktion bei Risikopatienten.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
clinical_pearls: 'NSAR + RAAS-Hemmer + Diuretikum: Risiko für akutes Nierenversagen.'
