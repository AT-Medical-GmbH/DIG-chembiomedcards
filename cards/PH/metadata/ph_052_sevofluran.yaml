interactions: Verstärkt nichtdepolarisierende Muskelrelaxanzien.
monitoring: Endtidale Konzentration, Kreislauf, endtidales CO₂.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
clinical_pearls: Alle volatilen Anästhetika können eine maligne Hyperthermie auslösen.
