indications: Bei lebensbedrohlichen Rhythmusstörungen oder ausgeprägter Hyperkaliämie, nach toxikologischer
  Rücksprache.
adverse_effects: Spiegelmessung danach unzuverlässig; Hypokaliämie und Verschlechterung der Herzinsuffizienz
  möglich.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
