substance_name: Atropin
generic_name: Atropin
card_type: antidote
front_type: antidote
level: clinical
difficulty: intermediate
mechanism_of_action: Kompetitiver Antagonist an muskarinischen Rezeptoren; keine Wirkung an nikotinischen
  Rezeptoren.
indications: Titriert, bis die Bronchialsekretion abtrocknet; oft große Gesamtmengen nötig. Auch bei symptomatischer
  Bradykardie.
adverse_effects: Übertitration führt zu anticholinerger Toxizität (Tachykardie, Hyperthermie, Delir);
  Muskelschwäche bleibt unbeeinflusst.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
toxicology_relevance: Cholinerges Syndrom (Organophosphate, Carbamate, muskarinhaltige Pilze).
antidote: atropin
toxidrome: cholinerg
clinical_pearls: Steuergröße ist die trockene Lunge, nicht Pupille oder Herzfrequenz.
