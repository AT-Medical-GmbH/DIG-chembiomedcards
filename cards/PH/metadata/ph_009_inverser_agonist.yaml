title: Inverser Agonist
subtitle: Wirkung unter Basalaktivität
module: PH
primary_category: pharmakodynamik
chapter: pharmakologie/pharmakodynamik
card_type: overview
front_type: principle
level: advanced
difficulty: advanced
front_content:
  question: Was unterscheidet einen inversen Agonisten vom neutralen Antagonisten?
back_sections:
- key: kernaussage
  label: Kernaussage
  color_role: base
  text: Ein inverser Agonist bindet an einen konstitutiv aktiven Rezeptor und senkt dessen Grundaktivität
    unter den Basalwert.
- key: vertiefung
  label: Abgrenzung
  color_role: pkpd
  text: '- Agonist: erhöht Aktivität

    - neutraler Antagonist: lässt Basalaktivität unverändert

    - inverser Agonist: senkt Basalaktivität'
- key: klinischer_bezug
  label: Relevanz
  color_role: clinic
  text: Relevant bei Rezeptoren mit konstitutiver Aktivität (z. B. manche Antihistaminika).
- key: merke
  label: Merke
  color_role: antidote
  text: Setzt voraus, dass der Rezeptor ohne Ligand bereits aktiv ist.
learning_objectives:
- Inversen Agonismus von Antagonismus abgrenzen
