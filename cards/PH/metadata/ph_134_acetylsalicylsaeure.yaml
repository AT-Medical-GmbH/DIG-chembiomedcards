card_id: ph_134
slug: ph_134_acetylsalicylsaeure
title: Acetylsalicylsäure (ASS)
subtitle: COX-Hemmer, Thrombozytenhemmer
module: PH
primary_category: analgetika
secondary_categories:
- thrombozytenaggregationshemmer
chapter: pharmakologie/analgetika
drug_class: thrombozytenhemmer
substance_name: Acetylsalicylsäure (ASS)
generic_name: Acetylsalicylsäure (ASS)
card_type: substance
front_type: substance
level: clinical
difficulty: intermediate
mechanism_of_action: Irreversible Acetylierung der Cyclooxygenase; niedrig dosiert v. a. Hemmung der thrombozytären
  Thromboxan-Bildung.
indications: '- Sekundärprophylaxe kardiovaskulärer Ereignisse, akutes Koronarsyndrom (niedrig dosiert)

  - Schmerzen, Fieber (höher dosiert)'
contraindications: Aktive Blutung, Ulkus; Kinder/Jugendliche mit Virusinfekt (Reye-Syndrom); letztes Schwangerschaftsdrittel
  (analgetisch).
adverse_effects: Magen-Darm-Blutung und Ulzera, Blutungsneigung, Bronchospasmus bei Analgetika-Asthma.
interactions: Antikoagulanzien und SSRI (Blutung), Methotrexat.
monitoring: Blutungszeichen.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
toxidrome: salicylat
clinical_pearls: Die Plättchenhemmung hält über die Lebensdauer der Thrombozyten (etwa 7–10 Tage) an.
