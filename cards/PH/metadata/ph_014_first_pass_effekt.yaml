title: First-Pass-Effekt
subtitle: Präsystemische Metabolisierung
module: PH
primary_category: pharmakokinetik
chapter: pharmakologie/pharmakokinetik
card_type: overview
front_type: principle
level: intermediate
difficulty: intermediate
front_content:
  question: Warum senkt der First-Pass-Effekt die orale Bioverfügbarkeit?
back_sections:
- key: kernaussage
  label: Kernaussage
  color_role: base
  text: Oral aufgenommene Wirkstoffe passieren Leber (und Darmwand), bevor sie den Kreislauf erreichen;
    ein Teil wird dort metabolisiert.
- key: vertiefung
  label: Folge
  color_role: pkpd
  text: Starker First-Pass-Effekt senkt die orale Bioverfügbarkeit erheblich (z. B. bei bestimmten Opioiden,
    Nitraten).
- key: klinischer_bezug
  label: Umgehung
  color_role: clinic
  text: Sublinguale, transdermale oder parenterale Gabe umgeht den First-Pass-Effekt.
- key: merke
  label: Merke
  color_role: antidote
  text: Erst die Leber, dann der Kreislauf – bei oraler Gabe.
