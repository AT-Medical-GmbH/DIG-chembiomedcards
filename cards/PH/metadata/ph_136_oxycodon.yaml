mechanism_of_action: µ-Opioidrezeptor-Agonist mit hoher oraler Bioverfügbarkeit.
indications: '- starke Schmerzen (oral, retardiert oder schnell freisetzend)'
contraindications: Schwere Ateminsuffizienz, paralytischer Ileus.
