title: Rezeptorbindung
subtitle: Affinität, Besetzung und Wirkung
module: PH
primary_category: pharmakodynamik
chapter: pharmakologie/pharmakodynamik
card_type: overview
front_type: principle
level: intermediate
difficulty: intermediate
front_content:
  question: Wovon hängt die Wirkung einer Rezeptorbindung ab?
back_sections:
- key: kernaussage
  label: Kernaussage
  color_role: base
  text: Viele Arzneistoffe wirken durch reversible Bindung an Rezeptoren; die Wirkung hängt von Affinität
    und intrinsischer Aktivität ab.
- key: vertiefung
  label: Bindungstypen
  color_role: pkpd
  text: '- reversibel: nicht-kovalent, konzentrationsabhängig

    - irreversibel: kovalent, Wirkung bis zur Rezeptorneusynthese

    - Rezeptorfamilien: ionotrop, G-Protein-gekoppelt, enzymgekoppelt, nukleär'
- key: klinischer_bezug
  label: Konsequenz
  color_role: clinic
  text: Reversible Bindung erlaubt Steuerbarkeit; irreversible Hemmung wirkt lang (z. B. ASS auf COX).
- key: merke
  label: Merke
  color_role: antidote
  text: Affinität = Andocken, intrinsische Aktivität = Auslösen.
learning_objectives:
- Bindungstypen unterscheiden
- Rezeptorfamilien benennen
