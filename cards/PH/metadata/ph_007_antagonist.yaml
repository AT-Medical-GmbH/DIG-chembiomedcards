front_content:
  question: Wie wirkt ein Antagonist am Rezeptor?
back_sections:
- key: kernaussage
  label: Kernaussage
  color_role: base
  text: Ein Antagonist bindet an den Rezeptor (Affinität), aktiviert ihn aber nicht (keine intrinsische
    Aktivität) und blockiert Agonisten.
- key: vertiefung
  label: Formen
  color_role: pkpd
  text: '- kompetitiv: verdrängbar, Rechtsverschiebung der Kurve

    - nichtkompetitiv: nicht verdrängbar, Emax sinkt

    - funktionell/physiologisch: gegensätzliche Wirkung über anderen Weg'
- key: klinischer_bezug
  label: Beispiele
  color_role: clinic
  text: Betablocker, Antihistaminika, Opioid-Antagonisten (z. B. Naloxon).
- key: merke
  label: Merke
  color_role: antidote
  text: Antagonist = andockt, aber nicht auslöst.
learning_objectives:
- Antagonist definieren
- kompetitiv und nichtkompetitiv unterscheiden
