chapter: pharmakologie/analgetika
drug_class: opioide
substance_name: Buprenorphin
generic_name: Buprenorphin
card_type: substance
front_type: substance
level: clinical
difficulty: intermediate
mechanism_of_action: Partialagonist am µ-Rezeptor mit sehr hoher Affinität, Antagonist am κ-Rezeptor.
indications: '- starke chronische Schmerzen (transdermal, sublingual)

  - Substitution bei Opioidabhängigkeit'
contraindications: Kann bei Abhängigen unter Vollagonisten einen Entzug auslösen.
adverse_effects: Übelkeit, Schwindel, Obstipation; Atemdepression geringer (Ceiling-Effekt), aber möglich.
interactions: Additiv mit Benzodiazepinen; Vollagonisten wirken unter Buprenorphin schlechter.
monitoring: Atmung bei Kombinationen.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
antidote: naloxon
clinical_pearls: Wegen hoher Affinität verdrängt Naloxon es nur schwer.
