mechanism_of_action: 'Hemmung des Angiotensin-Konversionsenzyms: weniger Angiotensin II und Aldosteron,
  weniger Bradykinin-Abbau.'
indications: '- Hypertonie, Herzinsuffizienz

  - nach Myokardinfarkt, diabetische Nephropathie'
contraindications: Angioödem in der Anamnese, Schwangerschaft, beidseitige Nierenarterienstenose.
adverse_effects: Reizhusten, Hyperkaliämie, Nierenfunktionsverschlechterung, Angioödem, Hypotonie.
interactions: Kaliumsparende Diuretika (Hyperkaliämie), NSAR (Niere), Lithium.
monitoring: Kalium, Kreatinin.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
clinical_pearls: Husten → Wechsel auf AT1-Blocker; nach Angioödem nie wieder ACE-Hemmer.
