chapter: pharmakologie/notfallmedikamente
drug_class: vasopressoren
substance_name: Noradrenalin
generic_name: Noradrenalin
card_type: substance
front_type: substance
level: clinical
difficulty: intermediate
mechanism_of_action: Vorwiegend α1-Agonist (Vasokonstriktion, Anstieg des peripheren Widerstands), geringer
  β1-Effekt.
indications: '- Hypotonie bei Vasodilatation (z. B. septischer Schock)

  - Kreislaufstabilisierung in Anästhesie/Intensiv'
contraindications: Unkorrigierte Hypovolämie (Volumenstatus zuerst prüfen).
adverse_effects: Periphere Minderperfusion, Arrhythmien, Reflexbradykardie, Gewebsnekrose bei Paravasat.
interactions: Wirkverstärkung durch MAO-Hemmer/TZA möglich.
monitoring: Invasive Blutdruckmessung; Gabe möglichst über zentralen Zugang.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
emergency_relevance: Notfall- und Intensivmedikament.
clinical_pearls: Vasopressor ersetzt kein Volumen; Paravasat vermeiden.
