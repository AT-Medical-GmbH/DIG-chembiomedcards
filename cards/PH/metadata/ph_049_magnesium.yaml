card_id: ph_049
slug: ph_049_magnesium
title: Magnesium (Magnesiumsulfat)
subtitle: Elektrolyt mit antiarrhythmischer Wirkung
module: PH
primary_category: notfallmedikamente
secondary_categories:
- intensivpharmakologie
chapter: pharmakologie/notfallmedikamente
substance_name: Magnesium
generic_name: Magnesium
card_type: substance
front_type: substance
level: clinical
difficulty: intermediate
mechanism_of_action: 'Physiologischer Calciumantagonist: stabilisiert Membranen, wirkt antiarrhythmisch,
  bronchodilatatorisch und antikonvulsiv.'
indications: '- Torsade de pointes

  - (Prä-)Eklampsie

  - schwerer Asthmaanfall (Ko-Therapie)

  - Hypomagnesiämie'
contraindications: Niereninsuffizienz (Kumulation), Myasthenia gravis, höhergradiger AV-Block.
adverse_effects: Hypotonie, Flush, Reflexabschwächung, AV-Blockierung; bei Überdosierung Atemdepression.
interactions: Verstärkt Muskelrelaxanzien.
monitoring: Reflexe, Atmung, Blutdruck, ggf. Serumspiegel. Bei Überdosierung Calcium als Gegenmittel.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
emergency_relevance: Notfall- und Intensivmedikament.
clinical_pearls: Abgeschwächte Sehnenreflexe sind ein frühes Zeichen der Überdosierung.
