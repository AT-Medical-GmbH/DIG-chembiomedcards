chapter: pharmakologie/notfallmedikamente
drug_class: benzodiazepine
substance_name: Midazolam
generic_name: Midazolam
card_type: substance
front_type: substance
level: clinical
difficulty: intermediate
mechanism_of_action: 'Positiv allosterischer Modulator am GABA-A-Rezeptor: sedierend, anxiolytisch, antikonvulsiv,
  amnestisch.'
indications: '- Sedierung/Prämedikation

  - Krampfanfall/Status epilepticus

  - Narkoseeinleitung (Ko-Medikation)'
contraindications: Schwere respiratorische Insuffizienz ohne Atemwegssicherung, Myasthenia gravis.
adverse_effects: Atemdepression (besonders mit Opioiden), Hypotonie, paradoxe Erregung, anterograde Amnesie.
interactions: CYP3A4-Inhibitoren verstärken die Wirkung; Opioide/Alkohol additive Atemdepression.
monitoring: Atmung, SpO₂, Vigilanz; Atemwegsmanagement bereithalten.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
emergency_relevance: Notfall- und Intensivmedikament.
clinical_pearls: Ältere und kritisch Kranke reagieren empfindlicher. Antagonisierung mit Flumazenil nur
  zurückhaltend.
