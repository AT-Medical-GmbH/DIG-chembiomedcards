  question: Was beschreibt die Pharmakodynamik?
back_sections:
- key: kernaussage
  label: Kernaussage
  color_role: base
  text: Pharmakodynamik beschreibt die Wirkung eines Arzneistoffs und ihren Mechanismus (meist über Rezeptoren
    oder Enzyme).
- key: vertiefung
  label: Grundgrößen
  color_role: pkpd
  text: '- Affinität: Bindungsneigung an das Target

    - intrinsische Aktivität: Fähigkeit, es zu aktivieren

    - Wirkstärke (Potenz) und maximale Wirkung (Efficacy)'
- key: klinischer_bezug
  label: Dosis-Wirkung
  color_role: clinic
  text: Die Dosis-Wirkungs-Kurve verbindet Konzentration und Effekt; EC50 kennzeichnet die halbmaximale
    Wirkung.
- key: merke
  label: Merke
  color_role: antidote
  text: PD erklärt, warum ein Stoff wirkt – und warum er unerwünscht wirken kann.
learning_objectives:
- Affinität und intrinsische Aktivität unterscheiden
- Potenz von Efficacy abgrenzen
