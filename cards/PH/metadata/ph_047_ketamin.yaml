indications: '- Narkoseeinleitung bei hämodynamischer Instabilität

  - Analgesie (subanästhetisch)

  - Ko-Therapie bei schwerem Bronchospasmus'
contraindications: Unkontrollierte Hypertonie, schwere KHK, akute Psychose (relativ).
adverse_effects: Hypersalivation, Aufwachreaktionen/Halluzinationen, Hypertonie, Tachykardie, erhöhter
  myokardialer O₂-Bedarf.
interactions: Additive Effekte mit anderen ZNS-dämpfenden Substanzen.
monitoring: Blutdruck, Herzfrequenz, Atmung.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
emergency_relevance: Notfall- und Intensivmedikament.
clinical_pearls: 'Esketamin ist das S-Enantiomer und wirkt etwa doppelt so stark: Verwechslungsgefahr.'
