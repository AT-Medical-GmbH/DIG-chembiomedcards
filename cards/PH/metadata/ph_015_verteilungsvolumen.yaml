front_content:
  question: Was sagt ein großes Verteilungsvolumen aus?
back_sections:
- key: kernaussage
  label: Kernaussage
  color_role: base
  text: Das Verteilungsvolumen (Vd) ist ein scheinbares Volumen, das Wirkstoffmenge im Körper und Plasmakonzentration
    verknüpft.
- key: vertiefung
  label: Interpretation
  color_role: pkpd
  text: '- kleines Vd: v. a. intravasal (hohe Proteinbindung)

    - großes Vd: starke Gewebebindung/Lipophilie'
- key: klinischer_bezug
  label: Konsequenz
  color_role: clinic
  text: Großes Vd erschwert die Elimination durch Dialyse; beeinflusst die Aufsättigungsdosis (Prinzip).
- key: merke
  label: Merke
  color_role: antidote
  text: Vd ist ein Rechenvolumen, kein anatomisches.
learning_objectives:
- Vd interpretieren
- Bezug zu Proteinbindung/Lipophilie herstellen
