back_sections:
- key: kernaussage
  label: Kernaussage
  color_role: base
  text: Pharmakokinetik beschreibt den zeitlichen Konzentrationsverlauf eines Wirkstoffs im Körper.
- key: vertiefung
  label: LADME
  color_role: pkpd
  text: '- Liberation: Freisetzung aus der Darreichungsform

    - Absorption: Aufnahme ins Blut

    - Distribution: Verteilung in Gewebe

    - Metabolismus: Umwandlung (v. a. Leber)

    - Elimination: Ausscheidung (v. a. Niere)'
- key: klinischer_bezug
  label: Kenngrößen
  color_role: clinic
  text: Bioverfügbarkeit, Verteilungsvolumen, Halbwertszeit und Clearance beschreiben die PK quantitativ.
- key: merke
  label: Merke
  color_role: antidote
  text: PK bestimmt, wie viel Wirkstoff wann am Wirkort ankommt.
learning_objectives:
- Die fünf LADME-Schritte erläutern
- PK-Kenngrößen zuordnen
