title: Dosis-Wirkungs-Kurve
subtitle: EC50, Potenz und maximale Wirkung
module: PH
primary_category: pharmakodynamik
chapter: pharmakologie/pharmakodynamik
card_type: overview
front_type: principle
level: intermediate
difficulty: intermediate
front_content:
  question: Was zeigt die Dosis-Wirkungs-Kurve?
back_sections:
- key: kernaussage
  label: Kernaussage
  color_role: base
  text: Die Dosis-Wirkungs-Kurve stellt den Effekt gegen die Konzentration dar, meist sigmoid bei logarithmischer
    Dosisachse.
- key: vertiefung
  label: Kenngrößen
  color_role: pkpd
  text: '- EC50: Konzentration mit halbmaximaler Wirkung (Potenz)

    - Emax: maximale Wirkung (Efficacy)

    - Linksverschiebung = höhere Potenz'
- key: klinischer_bezug
  label: Nutzen
  color_role: clinic
  text: Vergleich von Wirkstoffen hinsichtlich Potenz und maximaler Wirksamkeit; Grundlage der therapeutischen
    Breite.
- key: merke
  label: Merke
  color_role: antidote
  text: Potenz (EC50) ≠ Wirksamkeit (Emax).
learning_objectives:
- EC50 und Emax interpretieren
- Potenz von Efficacy unterscheiden
