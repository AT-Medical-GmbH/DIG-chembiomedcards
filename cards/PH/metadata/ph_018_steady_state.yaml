front_content:
  question: Wann ist der Steady State erreicht?
back_sections:
- key: kernaussage
  label: Kernaussage
  color_role: base
  text: Im Steady State sind zugeführte und eliminierte Wirkstoffmenge gleich; die mittlere Konzentration
    bleibt konstant.
- key: vertiefung
  label: Zeit
  color_role: pkpd
  text: Wird nach ~4–5 Halbwertszeiten erreicht – unabhängig von der Dosisgröße (nur schneller mit Aufsättigung).
- key: klinischer_bezug
  label: Konsequenz
  color_role: clinic
  text: Erklärt, warum Wirkung erst verzögert voll einsetzt und wann Spiegelkontrollen sinnvoll sind.
- key: merke
  label: Merke
  color_role: antidote
  text: Aufsättigungsdosis bringt den Spiegel schneller, nicht höher.
learning_objectives:
- Steady State definieren
- Zeit bis Steady State abschätzen
