  question: Was leisten Phase I und Phase II in der Leber?
back_sections:
- key: kernaussage
  label: Kernaussage
  color_role: base
  text: Die Leber wandelt Wirkstoffe in Phase I (z. B. CYP-Oxidation) und Phase II (Konjugation) in meist
    besser ausscheidbare Formen um.
- key: vertiefung
  label: Phasen
  color_role: pkpd
  text: '- Phase I: Oxidation/Reduktion/Hydrolyse (oft CYP)

    - Phase II: Konjugation (z. B. Glucuronidierung)'
- key: risiken_cave
  label: Cave
  color_role: risk
  text: Leberinsuffizienz kann den Abbau verlangsamen → Kumulation/Toxizität, Dosisanpassung prüfen.
- key: merke
  label: Merke
  color_role: antidote
  text: Phase I funktionalisiert, Phase II konjugiert.
