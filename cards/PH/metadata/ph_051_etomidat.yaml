substance_name: Etomidat
generic_name: Etomidat
card_type: substance
front_type: substance
level: clinical
difficulty: intermediate
mechanism_of_action: 'Modulation des GABA-A-Rezeptors: Hypnose mit nur geringer Kreislaufdepression.'
indications: '- Narkoseeinleitung bei kardiovaskulär instabilen Patienten'
contraindications: Nicht zur Dauersedierung. Zurückhaltung bei Sepsis wegen Nebennierensuppression.
adverse_effects: Hemmung der 11β-Hydroxylase (Nebennierensuppression schon nach Einzelgabe), Myoklonien,
  Injektionsschmerz, Übelkeit.
interactions: Additiv mit anderen Hypnotika und Opioiden.
monitoring: Kreislauf, Atmung.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
clinical_pearls: 'Kreislaufstabil, aber Nebennierensuppression: nur zur Einleitung.'
