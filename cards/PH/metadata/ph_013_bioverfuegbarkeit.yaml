front_content:
  question: Was beschreibt die Bioverfügbarkeit F?
back_sections:
- key: kernaussage
  label: Kernaussage
  color_role: base
  text: Die Bioverfügbarkeit (F) ist der Anteil einer Dosis, der unverändert den systemischen Kreislauf
    erreicht.
- key: vertiefung
  label: Grundlagen
  color_role: pkpd
  text: '- i.v.: F = 100 % (Referenz)

    - oral: F < 100 % durch unvollständige Absorption und First-Pass-Effekt'
- key: klinischer_bezug
  label: Konsequenz
  color_role: clinic
  text: Bestimmt u. a. das Verhältnis oraler zu parenteraler Dosis (Dosisprinzip, keine konkreten Zahlen
    hier).
- key: merke
  label: Merke
  color_role: antidote
  text: Niedriges F → höhere orale Dosis nötig als i.v.
learning_objectives:
- Bioverfügbarkeit definieren
- Ursachen für F < 100 % benennen
