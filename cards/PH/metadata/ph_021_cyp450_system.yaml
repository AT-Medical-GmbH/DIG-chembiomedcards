difficulty: intermediate
front_content:
  question: Welche Rolle spielt CYP450 im Arzneistoffmetabolismus?
back_sections:
- key: kernaussage
  label: Kernaussage
  color_role: base
  text: Cytochrom-P450-Enzyme (v. a. in der Leber) katalysieren den oxidativen Phase-I-Abbau vieler Arzneistoffe.
- key: vertiefung
  label: Prinzip
  color_role: pkpd
  text: '- Induktion: mehr Enzym → schnellerer Abbau → geringere Spiegel

    - Inhibition: weniger Umsatz → höhere Spiegel → Toxizitätsrisiko'
- key: risiken_cave
  label: Cave
  color_role: risk
  text: Zentrale Quelle von Arzneimittelinteraktionen; besonders bei enger therapeutischer Breite kritisch.
- key: merke
  label: Merke
  color_role: antidote
  text: Induktor senkt, Inhibitor hebt den Spiegel.
learning_objectives:
- Rolle des CYP450-Systems erklären
- Induktion von Inhibition unterscheiden
