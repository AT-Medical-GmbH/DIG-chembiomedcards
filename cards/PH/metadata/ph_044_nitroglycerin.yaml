indications: '- Angina pectoris / akutes Koronarsyndrom (symptomatisch)

  - akute Herzinsuffizienz mit Lungenödem und Hypertonie'
contraindications: Hypotonie, Rechtsherzinfarkt, kürzliche Einnahme von PDE-5-Hemmern, schwere Aortenstenose.
