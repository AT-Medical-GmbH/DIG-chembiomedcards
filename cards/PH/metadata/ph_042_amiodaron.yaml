interactions: 'CYP-Hemmung: Spiegel von Vitamin-K-Antagonisten und Digoxin steigen; additive QT-Verlängerung.'
monitoring: EKG (QT), Blutdruck; bei Langzeitgabe Schilddrüse, Leber, Lunge.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
