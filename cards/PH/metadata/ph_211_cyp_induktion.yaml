interactions: Induktoren steigern die Enzymsynthese; die Wirkung beginnt und endet verzögert (Tage bis
  Wochen).
monitoring: Kombination prüfen, Spiegel bzw. Wirkung überwachen, Dosis anpassen – auch nach dem Absetzen.
clinical_pearls: 'Typische Induktoren: Rifampicin, Carbamazepin, Phenytoin, Johanniskraut.'
