back_sections:
- key: kernaussage
  label: Kernaussage
  color_role: base
  text: P-Glykoprotein (P-gp) ist eine Effluxpumpe, die Arzneistoffe aus Zellen heraustransportiert (Darm,
    Blut-Hirn-Schranke, Niere).
- key: vertiefung
  label: Prinzip
  color_role: pkpd
  text: '- Inhibition erhöht Resorption/Spiegel von Substraten

    - Induktion senkt sie'
- key: risiken_cave
  label: Cave
  color_role: risk
  text: Transporter-Interaktionen ergänzen CYP-Interaktionen (z. B. bei bestimmten Antikoagulanzien).
- key: merke
  label: Merke
  color_role: antidote
  text: 'Nicht nur CYP: auch Transporter machen Interaktionen.'
