back_sections:
- key: kernaussage
  label: Kernaussage
  color_role: base
  text: Ein Prodrug ist selbst inaktiv oder wenig aktiv und wird erst durch Metabolismus in die Wirkform
    überführt.
- key: vertiefung
  label: Zweck
  color_role: pkpd
  text: Verbesserung von Resorption, Verträglichkeit oder Zielsteuerung.
- key: risiken_cave
  label: Cave
  color_role: risk
  text: Hängt die Aktivierung von einem polymorphen Enzym (z. B. CYP2D6) ab, variiert die Wirkung individuell.
- key: merke
  label: Merke
  color_role: antidote
  text: 'Prodrug: Aktivierung erforderlich, bevor es wirkt.'
