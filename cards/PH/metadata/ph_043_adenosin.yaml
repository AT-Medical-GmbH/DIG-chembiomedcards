chapter: pharmakologie/notfallmedikamente
drug_class: antiarrhythmika
substance_name: Adenosin
generic_name: Adenosin
card_type: substance
front_type: substance
level: clinical
difficulty: intermediate
mechanism_of_action: 'Agonist an A1-Rezeptoren im AV-Knoten: kurzfristige Blockierung der AV-Überleitung.'
indications: '- Terminierung paroxysmaler supraventrikulärer Reentry-Tachykardien

  - diagnostisch bei Schmalkomplextachykardie'
contraindications: Asthma bronchiale, AV-Block II°/III°, Sick-Sinus. Vorsicht bei Präexzitation mit Vorhofflimmern.
adverse_effects: Kurze Asystolie, Flush, Dyspnoe/Bronchospasmus, Brustdruck, Angstgefühl.
interactions: Dipyridamol verstärkt, Theophyllin/Koffein schwächen die Wirkung.
monitoring: Kontinuierliches EKG, Defibrillator bereit.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
emergency_relevance: Notfall- und Intensivmedikament.
clinical_pearls: 'Halbwertszeit im Sekundenbereich: schnelle Bolusgabe mit Nachspülen, Patient vorher
  aufklären.'
