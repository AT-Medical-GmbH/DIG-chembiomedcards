mechanism_of_action: Verstärken Antithrombin; wirken vorwiegend gegen Faktor Xa, weniger gegen Thrombin.
indications: '- Thromboseprophylaxe

  - Therapie von Thrombose und Lungenembolie

  - Bridging'
contraindications: Aktive Blutung, HIT in der Anamnese; Vorsicht bei Niereninsuffizienz (renale Elimination).
adverse_effects: Blutung, HIT (seltener als bei unfraktioniertem Heparin), Hämatome an der Einstichstelle.
interactions: Thrombozytenhemmer, NSAR.
monitoring: Nierenfunktion, Thrombozyten; Anti-Xa nur in Sondersituationen.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
antidote: protamin
clinical_pearls: Protamin hebt die Anti-Xa-Wirkung nur teilweise auf.
