front_content:
  question: Warum erreicht ein Partialagonist kein volles Emax?
back_sections:
- key: kernaussage
  label: Kernaussage
  color_role: base
  text: Ein Partialagonist erreicht auch bei voller Rezeptorbesetzung nur eine submaximale Wirkung (begrenzte
    intrinsische Aktivität).
- key: vertiefung
  label: Besonderheit
  color_role: pkpd
  text: In Gegenwart eines Vollagonisten wirkt er wie ein funktioneller Antagonist (konkurriert, deckelt
    die Maximalwirkung).
- key: klinischer_bezug
  label: Beispiele
  color_role: clinic
  text: Buprenorphin (partieller µ-Opioidagonist) als typisches Beispiel.
- key: merke
  label: Merke
  color_role: antidote
  text: 'Decke eingezogen: mehr Dosis hebt die Wirkung nicht über das Teilmaximum.'
learning_objectives:
- Partialagonismus erklären
- die funktionell-antagonistische Rolle verstehen
