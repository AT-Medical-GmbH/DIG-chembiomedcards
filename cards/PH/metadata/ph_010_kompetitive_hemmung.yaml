front_content:
  question: Wie verschiebt kompetitive Hemmung die Dosis-Wirkungs-Kurve?
back_sections:
- key: kernaussage
  label: Kernaussage
  color_role: base
  text: Der Hemmstoff konkurriert mit dem Agonisten/Substrat um dieselbe Bindungsstelle und ist durch
    höhere Agonistkonzentration verdrängbar.
- key: vertiefung
  label: Kurveneffekt
  color_role: pkpd
  text: 'Rechtsverschiebung der Dosis-Wirkungs-Kurve, Emax bleibt erreichbar (bei Enzymen: Km steigt,
    Vmax gleich).'
- key: klinischer_bezug
  label: Beispiel
  color_role: clinic
  text: Viele reversible Rezeptorantagonisten; Grundprinzip auch mancher Antidote.
- key: merke
  label: Merke
  color_role: antidote
  text: Mehr Agonist überwindet die Hemmung.
