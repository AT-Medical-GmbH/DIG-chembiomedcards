chapter: pharmakologie/anaesthesie
drug_class: opioide
substance_name: Fentanyl
generic_name: Fentanyl
card_type: substance
front_type: substance
level: clinical
difficulty: intermediate
mechanism_of_action: Hochpotenter µ-Opioidrezeptor-Agonist; stark lipophil, daher schneller Wirkeintritt.
indications: '- Analgesie in Anästhesie und Intensivmedizin

  - Notfallanalgesie

  - transdermal bei chronischen Tumorschmerzen'
contraindications: Nur mit Überwachung und Atemwegsmanagement. Pflaster nicht bei opioidnaiven Patienten.
adverse_effects: Atemdepression, Thoraxrigidität bei rascher hoher Gabe, Bradykardie, Übelkeit, Obstipation.
interactions: CYP3A4-Inhibitoren erhöhen den Spiegel; additive Atemdepression mit Sedativa.
monitoring: Atmung, SpO₂, Vigilanz.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
antidote: naloxon
clinical_pearls: Die kontextsensitive Halbwertszeit steigt bei langer Infusion deutlich an.
