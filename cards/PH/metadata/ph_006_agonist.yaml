back_sections:
- key: kernaussage
  label: Kernaussage
  color_role: base
  text: Ein Agonist bindet an einen Rezeptor und löst eine Antwort aus (Affinität + intrinsische Aktivität).
- key: vertiefung
  label: Typen
  color_role: pkpd
  text: '- Vollagonist: maximale Wirkung

    - Partialagonist: submaximale Wirkung trotz voller Besetzung'
- key: klinischer_bezug
  label: Beispiele
  color_role: clinic
  text: Grundprinzip vieler Wirkstoffklassen (z. B. Rezeptor-Agonisten in Notfall- und Dauertherapie).
- key: merke
  label: Merke
  color_role: antidote
  text: Partialagonist kann in Gegenwart eines Vollagonisten abschwächend wirken.
learning_objectives:
- Agonist über Affinität + intrinsische Aktivität definieren
- Voll- von Partialagonist unterscheiden
