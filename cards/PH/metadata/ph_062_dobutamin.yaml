mechanism_of_action: 'Synthetisches Katecholamin, vorwiegend β1-Agonist: positiv inotrop; geringe β2-vermittelte
  Vasodilatation.'
indications: '- kardiogener Schock, Low-Output-Syndrom

  - Stressechokardiographie'
contraindications: Hypertrophe obstruktive Kardiomyopathie, unkorrigierte Hypovolämie.
adverse_effects: Tachykardie, Arrhythmien, erhöhter myokardialer O₂-Bedarf, Hypotonie durch Vasodilatation.
interactions: Betablocker schwächen die Wirkung ab.
monitoring: EKG, invasiver Blutdruck, Herzzeitvolumen.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
clinical_pearls: 'Inotrop, aber kein Vasopressor: bei Hypotonie oft mit Noradrenalin kombiniert.'
