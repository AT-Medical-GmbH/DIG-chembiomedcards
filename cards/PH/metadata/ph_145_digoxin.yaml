card_id: ph_145
slug: ph_145_digoxin
title: Digoxin
subtitle: Herzglykosid
module: PH
primary_category: antiarrhythmika
secondary_categories:
- klinische_pharmakologie
chapter: pharmakologie/herz_kreislauf
drug_class: herzglykoside
substance_name: Digoxin
generic_name: Digoxin
card_type: substance
front_type: substance
level: clinical
difficulty: intermediate
mechanism_of_action: 'Hemmung der Na⁺/K⁺-ATPase: mehr intrazelluläres Calcium (inotrop) und vagale Hemmung
  des AV-Knotens.'
indications: '- Frequenzkontrolle bei Vorhofflimmern

  - Herzinsuffizienz (Reservemedikament)'
contraindications: AV-Block II°/III°, Präexzitation mit Vorhofflimmern, Hypokaliämie, Hyperkalzämie.
adverse_effects: Übelkeit, Sehstörungen (Gelb-Grün-Sehen), Bradykardie, nahezu jede Rhythmusstörung.
interactions: Amiodaron, Verapamil, Makrolide erhöhen den Spiegel; Diuretika (Hypokaliämie).
monitoring: Spiegel, Kalium, Nierenfunktion.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
antidote: digoxin_fab
toxidrome: digitalis
clinical_pearls: 'Enge therapeutische Breite: Hypokaliämie und Niereninsuffizienz fördern die Toxizität.'
