front_content:
  question: Warum senkt nichtkompetitive Hemmung das Emax?
back_sections:
- key: kernaussage
  label: Kernaussage
  color_role: base
  text: Der Hemmstoff bindet an eine andere Stelle oder irreversibel; er ist durch mehr Agonist nicht
    vollständig verdrängbar.
- key: vertiefung
  label: Kurveneffekt
  color_role: pkpd
  text: 'Emax sinkt (bei Enzymen: Vmax sinkt). Die maximale Wirkung ist nicht wiederherstellbar.'
- key: klinischer_bezug
  label: Beispiel
  color_role: clinic
  text: Irreversible Enzymhemmung (z. B. ASS auf COX) wirkt bis zur Neusynthese.
- key: merke
  label: Merke
  color_role: antidote
  text: Mehr Agonist hilft nicht – die Decke ist gesenkt.
