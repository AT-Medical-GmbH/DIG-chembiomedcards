substance_name: Furosemid
generic_name: Furosemid
card_type: substance
front_type: substance
level: clinical
difficulty: intermediate
mechanism_of_action: Hemmt den Na⁺-K⁺-2Cl⁻-Cotransporter im aufsteigenden Teil der Henle-Schleife.
indications: '- Lungenödem bei Volumenüberladung

  - Ödeme

  - unterstützend bei Hyperkaliämie'
contraindications: Hypovolämie, Anurie, schwere Elektrolytentgleisung.
adverse_effects: Hypokaliämie, Hyponatriämie, Hypovolämie, metabolische Alkalose, Ototoxizität bei rascher
  hoher i.v.-Gabe.
interactions: Aminoglykoside (Oto-/Nephrotoxizität), Digitalis (Hypokaliämie ↑ Toxizität), Lithium (Spiegel
  ↑).
monitoring: Elektrolyte, Nierenfunktion, Bilanz.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
emergency_relevance: Notfall- und Intensivmedikament.
clinical_pearls: Hypokaliämie plus Digitalis erhöht das Arrhythmierisiko.
