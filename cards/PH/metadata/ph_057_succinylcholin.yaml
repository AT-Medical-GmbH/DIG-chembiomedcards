adverse_effects: Hyperkaliämie, Bradykardie, Muskelschmerzen, Anstieg des Augeninnendrucks, Anaphylaxie.
interactions: Abbau durch Plasmacholinesterase; verlängert bei Mangel oder Cholinesterasehemmern.
monitoring: Kalium, EKG.
dose_principles: Konkrete Dosierung bewusst nicht angegeben. Nur nach aktueller Leitlinie bzw. Fachinformation;
  wird im Fachreview mit Quelle ergänzt.
clinical_pearls: Trigger der malignen Hyperthermie; kein Antagonist verfügbar.
