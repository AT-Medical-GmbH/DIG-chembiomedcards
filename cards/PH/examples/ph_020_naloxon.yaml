mechanism_of_action: |
  Kompetitiver **Antagonist** an Opioidrezeptoren (vorwiegend μ). Verdrängt Opioide vom Rezeptor und
  hebt deren Wirkung — insbesondere die **Atemdepression** — auf.
pharmacodynamics: |
  Rascher Wirkeintritt; **kurze Wirkdauer**, die kürzer sein kann als die des auslösenden Opioids →
  Gefahr des Wirkungs-„Rebounds“ (erneute Atemdepression).
pharmacokinetics: |
  Parenterale Gabe üblich; ausgeprägter First-Pass-Effekt bei oraler Gabe. Kurze Halbwertszeit →
  ggf. wiederholte Gabe oder kontinuierliche Strategie (fachlich zu steuern).
indications: |
  Verdacht auf **Opioidintoxikation** mit relevanter Atemdepression / reduzierter Vigilanz.
contraindications: |
  Relative Vorsicht bei bekannter Opioidabhängigkeit (Entzugssymptomatik möglich). Keine Anwendung
  ersetzt Basismaßnahmen (Atemweg/Beatmung).
adverse_effects: |
  Akutes **Entzugssyndrom** (Agitation, Tachykardie, Hypertonie, Erbrechen), Rebound-Atemdepression
  nach Nachlassen der Wirkung.
interactions: |
  Hebt Wirkung aller Opioide (auch Analgesie) auf; Interaktion mit partialagonistischen Opioiden
  möglich.
monitoring: |
  Engmaschige Überwachung von **Atmung, Vigilanz, Kreislauf** über die Wirkdauer des Opioids hinaus
  (Rebound-Gefahr).
dose_principles: |
  Titrieren nach Wirkung mit dem Ziel ausreichender **Spontanatmung**, nicht zwingend vollständiger
  Vigilanz. Konkrete Dosierungen sind bewusst NICHT angegeben und einer freigegebenen Quelle/Leitlinie
  vorbehalten (siehe review_status).
renal_adjustment: null
hepatic_adjustment: null
pregnancy_lactation_notes: |
  In vitaler Indikation (Atemdepression) ist die Behandlung der Mutter vorrangig; fachliche Prüfung
  erforderlich.
emergency_relevance: |
  Zentrales Notfall-Antidot bei Opioidintoxikation.
toxicology_relevance: |
  Spezifisches Antidot des **Opioid-Toxidroms** (Miosis, Atemdepression, reduzierte Vigilanz).
antidote: naloxon
toxidrome: opioid
clinical_pearls: |
  Wirkdauer von Naloxon kann **kürzer** sein als die des Opioids → Patient kann erneut eintrüben.
  Nachbeobachtung/Nachgabe-Strategie fachlich festlegen.
mnemonic: "Kurz wirksam — nicht nach einmaliger Besserung entlassen."

