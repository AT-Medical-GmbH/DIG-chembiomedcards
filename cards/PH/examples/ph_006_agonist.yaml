# Fachinhalt (Prinzipkarte → kein konkreter Wirkstoff)
mechanism_of_action: |
  Ein Agonist bindet an einen Rezeptor und löst eine zelluläre Antwort aus. Entscheidend sind
  **Affinität** (Bindungsneigung) und **intrinsische Aktivität** (Fähigkeit, den Rezeptor zu aktivieren).
pharmacodynamics: |
  Ein **Vollagonist** erreicht die maximale Wirkung (volle intrinsische Aktivität). Ein
  **Partialagonist** erreicht nur eine submaximale Wirkung, auch bei voller Rezeptorbesetzung.
pharmacokinetics: null
indications: |
  Konzept zur Einordnung vieler Wirkstoffklassen (z. B. Rezeptor-Agonisten in Notfall- und
  Dauertherapie). Dient dem Verständnis von Dosis-Wirkungs-Beziehungen.
contraindications: null
adverse_effects: null
interactions: |
  Agonisten können mit Antagonisten am selben Rezeptor um die Bindung konkurrieren
  (Grundlage kompetitiver Interaktionen).
monitoring: null
dose_principles: null
clinical_pearls: |
  Affinität entscheidet, *ob* gebunden wird; intrinsische Aktivität entscheidet, *wie stark* aktiviert
  wird. Partialagonisten können bei hoher Rezeptorbesetzung einen Vollagonisten abschwächen.
mnemonic: "Affinität = Andocken, intrinsische Aktivität = Auslösen."

front_content:
  question: "Was kennzeichnet einen Agonisten – und wie unterscheidet sich ein Partialagonist?"

back_sections:
  - { key: kernaussage, color_role: base,
      text: "Agonist = Bindung + Aktivierung (Affinität + intrinsische Aktivität)." }
  - { key: vertiefung, color_role: pkpd,
      text: "Vollagonist: maximale Wirkung. Partialagonist: submaximale Wirkung trotz voller Besetzung." }
  - { key: klinischer_bezug, color_role: clinic,
      text: "Grundlage zum Verständnis von Wirkstoffklassen und Dosis-Wirkungs-Kurven." }
  - { key: merke, color_role: antidote,
      text: "Partialagonist kann in Gegenwart eines Vollagonisten wie ein funktioneller Antagonist wirken." }

learning_objectives:
  - Agonist über Affinität und intrinsische Aktivität definieren
  - Voll- von Partialagonist unterscheiden
  - Bezug zur Dosis-Wirkungs-Kurve herstellen
