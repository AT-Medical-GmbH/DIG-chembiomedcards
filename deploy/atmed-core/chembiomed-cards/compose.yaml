# ChemBioMed Cards – Kartenproduktion und Auslieferung auf ATMED-core (ADR-024)
# Zielpfad: /srv/atmed/stacks/chembiomed-cards   (Runbook: deploy/README_MIGRATION.md)
#
#   runner – Forgejo-Runner im Host-Modus im Build-Image: rendert Karten bei jeder Änderung,
#            veröffentlicht nach sites/staging, nach Freigabe nach sites/production.
#            Kein Docker-Socket, nicht privilegiert, ohne Root.
#   sites  – nginx liefert sites/<kanal>/current aus; beide Kanäle mit Anmeldung (HTTP-Basic,
#            Kennwortdatei im Vault). Auf core gibt es keine Authentik-Forward-Auth (Phase 0).
name: chembiomed-cards

services:
  runner:
    image: chembiomed-builder:${BUILDER_TAG:?BUILDER_TAG fehlt}
    container_name: chembiomed-runner
    restart: unless-stopped
    command: ["forgejo-runner", "daemon", "--config", "/data/config.yaml"]
    environment:
      CREDENTIALS_DIRECTORY: /run/secrets
    volumes:
      - ./runner:/data
      - ./sites:/sites
      - ${RUNNER_TOKEN_FILE:?RUNNER_TOKEN_FILE fehlt}:/run/secrets/runner-token:ro
    networks:
      - forgejo_ci
    mem_limit: 3g
    cpus: 2

  sites:
    image: nginx:${NGINX_VERSION:-1.28-alpine}
    container_name: chembiomed-sites
    restart: unless-stopped
    environment:
      STAGING_HOST: ${STAGING_HOST:?STAGING_HOST fehlt}
      PROD_HOST: ${PROD_HOST:?PROD_HOST fehlt}
    volumes:
      - ./sites:/sites:ro
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${SITES_HTPASSWD_FILE:?SITES_HTPASSWD_FILE fehlt}:/etc/nginx/htpasswd:ro
    networks:
      - traefik_web
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_web
      - traefik.http.services.chembiomed-sites.loadbalancer.server.port=8080
      - traefik.http.routers.chembiomed-staging.rule=Host(`${STAGING_HOST}`)
      - traefik.http.routers.chembiomed-staging.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.chembiomed-staging.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.chembiomed-staging.service=chembiomed-sites
      - traefik.http.routers.chembiomed-prod.rule=Host(`${PROD_HOST}`)
      - traefik.http.routers.chembiomed-prod.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.chembiomed-prod.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.chembiomed-prod.service=chembiomed-sites
    mem_limit: 128m

networks:
  traefik_web:
    external: true
  forgejo_ci:
    external: true
